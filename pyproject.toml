[project]
name = "yasa-mcp"
version = "0.1.0"
description = "YASA MCP Server Framework — unified program analysis MCP service"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
yasa-mcp = "yasa_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yasa_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/mcp"]
